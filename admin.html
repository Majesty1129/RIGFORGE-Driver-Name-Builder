<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RIGFORGE Admin Builder v11</title>
<style>
@font-face{font-family:Nulshock;src:url('./Nulshock-Bold.otf') format('opentype');font-weight:700}
:root{--bg:#0b0e12;--panel:#11161d;--panel2:#171d25;--line:#303947;--text:#f4f7fb;--muted:#a9b6c7;--accent:#ff6500;--ok:#38d27c;--danger:#ff5b5b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
button,input,a{font:inherit}
button,a.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:800;font-size:15px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.primary{background:var(--accent);color:#090909}
.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.danger{background:#5a2020;color:#fff;border:1px solid #8d3b3b}
.wrap{max-width:1200px;margin:auto;padding:24px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}
h1{margin:0;font-size:32px}
.sub{color:var(--muted);margin-top:6px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px}
.search{display:flex;gap:10px;flex-wrap:wrap}
input{flex:1;min-width:250px;background:#0d1218;border:1px solid var(--line);border-radius:12px;padding:14px;color:var(--text);font-size:17px;text-transform:uppercase}
.status{margin-top:12px;color:var(--muted)}
.ok{color:var(--ok)}
.err{color:var(--danger)}
.hidden{display:none!important}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
.meta{display:grid;grid-template-columns:150px 1fr;gap:9px 14px}
.meta div:nth-child(odd){color:var(--muted)}
.code{font-family:monospace;font-size:20px;color:var(--accent);font-weight:900}
.note{color:var(--muted);font-size:13px;line-height:1.5}
.recent-row{display:grid;grid-template-columns:1.2fr 1fr .8fr .7fr auto auto;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px}
.status-badge{display:inline-flex;padding:5px 9px;border-radius:999px;background:#202733;border:1px solid var(--line);font-size:12px;font-weight:800}
.status-controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
select{background:#0d1218;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:800}
.status-saved{color:#d7e1ef}.status-ordered{color:#60a5fa}.status-processing{color:#f59e0b}.status-completed{color:#38d27c}.status-shipped{color:#c084fc}.status-cancelled{color:#ff8a8a}
.item{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:15px;margin-top:12px}
.item-head{display:flex;justify-content:space-between;gap:10px;align-items:center}
.item-title{font-size:19px;font-weight:900}
.preview{background:#080b0f;border:1px solid var(--line);border-radius:12px;min-height:240px;display:flex;align-items:center;justify-content:center;overflow:auto;padding:18px;margin-top:12px}
.preview svg{max-width:100%;height:auto;background:#232931}
.item-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.tab.active{background:var(--accent);color:#090909}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.shipping-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
@media(max-width:700px){.recent-row{grid-template-columns:1fr}.recent-row .muted-hide{display:none}.shipping-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header>
 <div>
  <h1>RIGFORGE Admin Builder v11</h1>
  <div class="sub">주문 상태, 발송정보, Path SVG, 휴지통을 한 화면에서 관리합니다.</div>
 </div>
 <a class="btn ghost" href="index.html">고객 빌더</a>
</header>

<section class="panel">
 <div class="search">
  <input id="estimateInput" placeholder="견적번호 입력 (예: DN-260725-4SJ6)" maxlength="20">
  <button type="button" class="primary" id="searchBtn">견적 조회</button>
  <button type="button" class="ghost" id="recentBtn">최근 견적 불러오기</button>
 </div>
 <div id="status" class="status">견적번호를 입력하거나 목록에서 선택하세요.</div>
 <div class="tabs">
  <button type="button" class="ghost tab active" id="activeTabBtn">활성 견적</button>
  <button type="button" class="ghost tab" id="trashTabBtn">휴지통</button>
 </div>
 <div class="filter-row" id="statusFilters">
  <button type="button" class="ghost" data-filter="all">전체</button>
  <button type="button" class="ghost" data-filter="saved">견적 저장</button>
  <button type="button" class="ghost" data-filter="ordered">주문확인</button>
  <button type="button" class="ghost" data-filter="processing">제작중</button>
  <button type="button" class="ghost" data-filter="completed">제작완료</button>
  <button type="button" class="ghost" data-filter="shipped">발송완료</button>
 </div>
 <div id="recentPanel" class="hidden" style="margin-top:14px">
  <div class="note" id="listTitle">최근 저장된 견적</div>
  <div id="recentList"></div>
 </div>
</section>

<div id="result" class="hidden">
 <div class="grid">
  <section class="panel">
   <h2>견적 정보</h2>
   <div class="meta" id="meta"></div>
  </section>
  <section class="panel">
   <h2>주문 상태 및 발송 관리</h2>
   <div class="note">주문확인 → 제작중 → 제작완료 → 발송완료 순서로 관리하세요.</div>
   <div class="status-controls">
    <select id="statusSelect">
     <option value="saved">견적 저장</option>
     <option value="ordered">주문확인</option>
     <option value="processing">제작중</option>
     <option value="completed">제작완료</option>
     <option value="shipped">발송완료</option>
     <option value="cancelled">취소</option>
    </select>
    <button type="button" class="primary" id="updateStatusBtn">상태 변경</button>
    <button type="button" class="danger" id="deleteCurrentBtn">휴지통으로 이동</button>
   </div>
   <div class="shipping-grid">
    <select id="carrierSelect">
     <option value="">택배사 선택</option>
     <option value="우체국택배">우체국택배</option>
     <option value="CJ대한통운">CJ대한통운</option>
     <option value="한진택배">한진택배</option>
     <option value="롯데택배">롯데택배</option>
     <option value="로젠택배">로젠택배</option>
     <option value="기타">기타</option>
    </select>
    <input id="trackingInput" placeholder="송장번호">
   </div>
   <div style="margin-top:10px">
    <button type="button" class="ghost" id="saveShippingBtn">발송정보 저장</button>
   </div>
  </section>
 </div>
 <section class="panel">
  <h2>제작 옵션</h2>
  <div id="items"></div>
 </section>
</div>
</div>

 return `<g transform="translate(${x} ${y}) scale(${w/212.195312} ${h/141.464844})">${FLAG_INNER}</g>`;

async function rpc(name,payload={}){
 const res=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`,{
  method:'POST',
  headers:{
   apikey:SUPABASE_KEY,
   Authorization:`Bearer ${SUPABASE_KEY}`,
   'Content-Type':'application/json'
  },
  body:JSON.stringify(payload)
 });
 const text=await res.text();
 if(!res.ok){
  let msg=text;
  try{const j=JSON.parse(text);msg=j.message||j.hint||text}catch{}
  throw new Error(msg);
 }
 return text?JSON.parse(text):null;
}

function glyphLayout(text){
 const chars=String(text||'').toUpperCase().split('');
 let x=0, minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
 const placed=[];
 for(let i=0;i<chars.length;i++){
  const ch=chars[i];
  const g=FONT_OUTLINES.glyphs[ch]||FONT_OUTLINES.glyphs[' '];
  if(i>0){
   const prev=FONT_OUTLINES.glyphs[chars[i-1]]||FONT_OUTLINES.glyphs[' '];
  }
  placed.push({ch,g,x});
  if(g.d){
   minX=Math.min(minX,x+g.xMin); minY=Math.min(minY,g.yMin);
   maxX=Math.max(maxX,x+g.xMax); maxY=Math.max(maxY,g.yMax);
  }
  x+=g.advance;
 }
 if(!isFinite(minX)){minX=0;minY=0;maxX=x;maxY=FONT_OUTLINES.unitsPerEm*0.7}
 return {placed,minX,minY,maxX,maxY,advance:x};
}

function outlinedTextMarkup(text,textH,x,y,anchor='start',fill='#fff'){
 const layout=glyphLayout(text);
 const rawH=Math.max(1,layout.maxY-layout.minY);
 const scale=textH/rawH;
 const visualW=(layout.maxX-layout.minX)*scale;
 let originX=x;
 if(anchor==='middle')originX=x-visualW/2;
 if(anchor==='end')originX=x-visualW;
 const tx=originX-layout.minX*scale;
 const ty=y+layout.maxY*scale;
 const paths=layout.placed.map(p=>p.g.d?`<path d="${p.g.d}" transform="translate(${p.x} 0)"/>`:'').join('');
 return {
  markup:`<g fill="${fill}" transform="translate(${tx} ${ty}) scale(${scale} ${-scale})">${paths}</g>`,
  width:visualW,
  height:textH
 };
}

function buildSvg(it){
 const fw=Number(it.flagW),fh=Number(it.flagH),qty=Number(it.qty);
 const temp=outlinedTextMarkup(it.text,it.textH,0,0,'start',it.color==='white'?'#fff':'#111');
 const textW=temp.width;
 const unitW=it.layout==='horizontal'?fw+GAP+textW:Math.max(fw,textW);
 const unitH=it.layout==='horizontal'?Math.max(fh,it.textH):fh+GAP+it.textH;
 const W=unitW,H=qty*unitH+(qty-1)*ROW_GAP;
 const fill=it.color==='white'?'#fff':'#111';
 let shapes='';
 for(let i=0;i<qty;i++){
  const gy=i*(unitH+ROW_GAP);
  let fx,fy,textX,textY,anchor;
  if(it.layout==='horizontal'){
   fx=0;fy=gy+(unitH-fh)/2;
   textX=fw+GAP;textY=gy+(unitH-it.textH)/2;anchor='start';
  }else{
   fx=(unitW-fw)/2;fy=gy;
   textX=unitW/2;textY=gy+fh+GAP;anchor='middle';
  }
  shapes+=flagMarkup(fx,fy,fw,fh);
  shapes+=outlinedTextMarkup(it.text,it.textH,textX,textY,anchor,fill).markup;
 }
 return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}mm" height="${H}mm" viewBox="0 0 ${W} ${H}"><metadata>RIGFORGE outlined production SVG - no live text</metadata>${shapes}</svg>`;
}

function downloadSvg(svg,name){
 const blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'});
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');
 a.href=url;a.download=name;
 document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1500);
}

function renderRecent(rows){
 CURRENT_LIST=rows;
 const panel=$('recentPanel'),list=$('recentList');
 panel.classList.remove('hidden');
 let visible=rows;
 if(CURRENT_MODE==='active' && CURRENT_FILTER!=='all'){
  visible=rows.filter(r=>r.status===CURRENT_FILTER);
 }
 $('listTitle').textContent=CURRENT_MODE==='trash'?'삭제된 견적':'최근 저장된 견적';
 if(!visible.length){
  list.innerHTML='<div class="note">표시할 견적이 없습니다.</div>';
  return;
 }
 list.innerHTML=visible.map(row=>`
  <div class="recent-row">
   <div><strong class="code" style="font-size:16px">${esc(row.estimate_no)}</strong></div>
   <div>${esc(row.driver_name||'-')}</div>
   <div class="muted-hide">${money(row.total_price)}</div>
   <div><span class="status-badge status-${esc(row.status||'saved')}">${esc(statusLabel(row.status||'saved'))}</span></div>
   ${CURRENT_MODE==='active'
    ?`<button type="button" class="ghost" data-open="${esc(row.estimate_no)}">조회</button><button type="button" class="danger" data-delete="${esc(row.estimate_no)}">삭제</button>`
    :`<button type="button" class="ghost" data-restore="${esc(row.estimate_no)}">복원</button><button type="button" class="danger" data-permanent="${esc(row.estimate_no)}">영구삭제</button>`}
  </div>`).join('');

 list.querySelectorAll('[data-open]').forEach(btn=>btn.onclick=()=>{
  $('estimateInput').value=btn.dataset.open; searchEstimate();
 });
 list.querySelectorAll('[data-delete]').forEach(btn=>btn.onclick=async()=>{
  const no=btn.dataset.delete;
  if(!confirm(`견적을 휴지통으로 이동할까요?\n\n${no}`))return;
  await softDeleteEstimate(no);
  renderRecent(await loadRecentEstimates());
  $('result').classList.add('hidden');
  $('status').className='status ok';$('status').textContent=`${no} 견적을 휴지통으로 이동했습니다.`;
 });
 list.querySelectorAll('[data-restore]').forEach(btn=>btn.onclick=async()=>{
  const no=btn.dataset.restore;
  if(!confirm(`견적을 복원할까요?\n\n${no}`))return;
  await restoreEstimate(no);
  renderRecent(await loadTrashEstimates());
  $('status').className='status ok';$('status').textContent=`${no} 견적을 복원했습니다.`;
 });
 list.querySelectorAll('[data-permanent]').forEach(btn=>btn.onclick=async()=>{
  const no=btn.dataset.permanent;
  if(!confirm(`정말 영구삭제할까요?\n\n${no}\n\n이 작업은 되돌릴 수 없습니다.`))return;
  await permanentlyDeleteEstimate(no);
  renderRecent(await loadTrashEstimates());
  $('status').className='status ok';$('status').textContent=`${no} 견적을 영구삭제했습니다.`;
 });

 }).join('');

  });

}

async function searchEstimate(){
 const no=$('estimateInput').value.trim().toUpperCase();
 if(!/^DN-\d{6}-[A-Z2-9]{4}$/.test(no)){
  $('status').className='status err';
  $('status').textContent='견적번호 형식을 확인해 주세요. 예: DN-260725-4SJ6';
  return;
 }
 $('status').className='status';
 $('status').textContent='견적을 불러오는 중입니다...';
 try{
  await document.fonts.load('700 100px Nulshock');
  const row=await lookupEstimate(no);
  if(!row)throw new Error('해당 견적번호를 찾지 못했습니다.');
  renderEstimate(row);
  $('status').className='status ok';
  $('status').textContent='견적을 불러왔습니다.';
 }catch(e){
  console.error(e);
  $('result').classList.add('hidden');
  $('status').className='status err';
  $('status').textContent='조회 실패: '+(e.message||e);
 }
}

$('activeTabBtn').onclick=async()=>{
 CURRENT_MODE='active';
 $('activeTabBtn').classList.add('active');$('trashTabBtn').classList.remove('active');
 $('statusFilters').classList.remove('hidden');
 renderRecent(await loadRecentEstimates());
};
$('trashTabBtn').onclick=async()=>{
 CURRENT_MODE='trash';
 $('trashTabBtn').classList.add('active');$('activeTabBtn').classList.remove('active');
 $('statusFilters').classList.add('hidden');
 $('result').classList.add('hidden');
 renderRecent(await loadTrashEstimates());
};
document.querySelectorAll('[data-filter]').forEach(btn=>btn.onclick=()=>{
 CURRENT_FILTER=btn.dataset.filter;
 renderRecent(CURRENT_LIST);
});

$('deleteCurrentBtn').addEventListener('click',async()=>{
 if(!CURRENT_ESTIMATE)return;
 const no=CURRENT_ESTIMATE.estimate_no;
 if(!confirm(`정말 삭제하시겠습니까?\n\n견적번호: ${no}\n\n삭제된 견적은 일반 목록에서 숨겨집니다.`))return;
 const btn=$('deleteCurrentBtn');
 btn.disabled=true;btn.textContent='삭제 중...';
 try{
  const ok=await softDeleteEstimate(no);
  if(!ok)throw new Error('삭제할 견적을 찾지 못했습니다.');
  CURRENT_ESTIMATE=null;
  $('result').classList.add('hidden');
  $('estimateInput').value='';
  $('status').className='status ok';
  $('status').textContent=`${no} 견적을 삭제 처리했습니다.`;
  if(!$('recentPanel').classList.contains('hidden'))renderRecent(await loadRecentEstimates());
 }catch(e){
  console.error(e);
  $('status').className='status err';
  $('status').textContent='삭제 실패: '+(e.message||e);
 }finally{
  btn.disabled=false;btn.textContent='현재 견적 삭제';
 }
});
</script>
</body>
</html>
